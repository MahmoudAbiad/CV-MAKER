services:
  - type: web
    name: cv-generator-bot
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: WEBHOOK_PATH
        value: /webhook
      - key: WEBHOOK_SECRET
        sync: false
      - key: ADMIN_GROUP_ID
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_VISION_MODEL
        value: gemini-2.5-flash
      - key: SHAM_CASH_CODE
        sync: false
      - key: DOCX_PRICE_USD
        value: "0.20"
      - key: DOCX_PRICE_SYP
        value: "25"
      - key: QR_IMAGE_PATH
        value: ./assets/sham_cash_qr.jpeg